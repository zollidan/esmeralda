name: Frontend Lint (dev)

on:
  push:
    branches:
      - dev
    paths:
      - "front/**/*"
  workflow_dispatch:

jobs:
  frontend-lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: front

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            front/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('front/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Run Biome
        run: bun run lint
