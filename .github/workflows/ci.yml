name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/zollidan

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.2.0
        with:
          version: 2.10.1
          args: --fix --timeout=5m

  build-and-push:
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/esmeralda-api:latest
            ${{ env.IMAGE_PREFIX }}/esmeralda-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Parser
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.parser
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/esmeralda-parser:latest
            ${{ env.IMAGE_PREFIX }}/esmeralda-parser:${{ github.sha }}
          cache-from: type=gha,scope=parser
          cache-to: type=gha,mode=max,scope=parser

      - name: Build and push Bot
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.bot
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/esmeralda-bot:latest
            ${{ env.IMAGE_PREFIX }}/esmeralda-bot:${{ github.sha }}
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot
