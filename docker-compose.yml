version: "3.8"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "3000:3000"
    volumes:
      - ./nginx/nginx-no-ssl.conf:/etc/nginx/nginx.conf:ro,Z
      - static_volume:/app/staticfiles:ro,Z
    depends_on:
      - web
    restart: always

  web:
    build: .
    command: >
      sh -c "uv run uvicorn main:app --host 0.0.0.0 --port 8000"
    env_file:
      - .env
    volumes:
      - static_volume:/code/staticfiles
    ports:
      - "8000:8000"
    networks:
      - default
    # depends_on:
    #   db:
    #     condition: service_healthy

  worker:
    build: .
    command: uv run celery -A esmeralda worker --loglevel=INFO --concurrency=1
    volumes:
      - .:/code:Z
    env_file: .env
    shm_size: "2gb"
    depends_on:
      # - db
      - redis

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  # db:
  #   image: postgres:13-alpine
  #   environment:
  #     - POSTGRES_DB=parser_db
  #     - POSTGRES_USER=postgres
  #     - POSTGRES_PASSWORD=postgres
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  static_volume:
