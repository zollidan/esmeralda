basePath: /api
definitions:
  models.Task:
    properties:
      created_at:
        type: string
      date:
        type: string
      id:
        type: string
      status:
        type: string
    type: object
  server.LoginUserRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  server.LoginUserResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  server.createTaskRequest:
    properties:
      date:
        type: string
    required:
    - date
    type: object
  server.errorResponse:
    properties:
      error:
        type: string
    type: object
  server.messageResponse:
    properties:
      message:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API для управления задачами парсинга
  title: Esmeralda API
  version: "1.0"
paths:
  /archive/:
    get:
      description: Возвращает архивные матчи (эндпоинт в разработке)
      produces:
      - application/json
      responses:
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/server.errorResponse'
      security:
      - BearerAuth: []
      summary: Получить архивные матчи
      tags:
      - archive
  /archive/upload:
    post:
      consumes:
      - multipart/form-data
      description: Загружает архивные матчи из файла (эндпоинт в разработке)
      parameters:
      - description: Файл архива
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/server.errorResponse'
      security:
      - BearerAuth: []
      summary: Загрузить архивные матчи
      tags:
      - archive
  /auth/login:
    post:
      consumes:
      - application/json
      description: Проверяет учетные данные и возвращает JWT токен
      parameters:
      - description: Логин и пароль
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.LoginUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.LoginUserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.errorResponse'
      summary: Авторизация пользователя
      tags:
      - auth
  /export/:
    get:
      description: Формирует XLSX файл по матчам за период date_start - date_end
      parameters:
      - description: Дата начала периода (YYYY-MM-DD)
        in: query
        name: date_start
        required: true
        type: string
      - description: Дата конца периода (YYYY-MM-DD)
        in: query
        name: date_end
        required: true
        type: string
      produces:
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.errorResponse'
      security:
      - BearerAuth: []
      summary: Экспортировать матчи в Excel
      tags:
      - export
  /health:
    get:
      description: Возвращает статус API
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Проверка доступности сервиса
      tags:
      - health
  /tasks/:
    get:
      description: Возвращает все задачи, отсортированные по времени создания
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Task'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.errorResponse'
      security:
      - BearerAuth: []
      summary: Получить список задач
      tags:
      - tasks
    post:
      consumes:
      - application/json
      description: Создает новую задачу на парсинг матчей за указанную дату
      parameters:
      - description: Дата задачи
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.createTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Task'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.errorResponse'
      security:
      - BearerAuth: []
      summary: Создать задачу парсинга
      tags:
      - tasks
  /tasks/{id}:
    delete:
      description: Удаляет задачу по ID
      parameters:
      - description: ID задачи
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.messageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.errorResponse'
      security:
      - BearerAuth: []
      summary: Удалить задачу
      tags:
      - tasks
    get:
      description: Возвращает одну задачу по идентификатору
      parameters:
      - description: ID задачи
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Task'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.errorResponse'
      security:
      - BearerAuth: []
      summary: Получить задачу по ID
      tags:
      - tasks
  /tasks/stream:
    get:
      description: Открывает Server-Sent Events поток с актуальным списком и изменениями
        задач
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Поток обновлений задач (SSE)
      tags:
      - tasks
securityDefinitions:
  BearerAuth:
    description: 'JWT токен в формате: Bearer <token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
