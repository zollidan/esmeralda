services:
  api:
    image: ghcr.io/zollidan/esmeralda-api:latest
    container_name: esmeralda-api
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPORT_API_TOKEN: ${SPORT_API_TOKEN}
      SERVER_PORT: ":8080"
      REDIS_ADDR: esmeralda-redis:6379
      DATABASE_DSN: "host=esmeralda-postgres user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_USER} port=5432 sslmode=disable"

  parser:
    image: ghcr.io/zollidan/esmeralda-parser:latest
    container_name: esmeralda-parser
    restart: unless-stopped
    environment:
      SPORT_API_TOKEN: ${SPORT_API_TOKEN}
      REDIS_ADDR: esmeralda-redis:6379
      DATABASE_DSN: "host=esmeralda-postgres user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_USER} port=5432 sslmode=disable"

networks:
  default:
    name: esmeralda-network
    external: true
