services:
  api:
    image: ghcr.io/zollidan/esmeralda-api:latest
    container_name: esmeralda-api
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPORT_API_TOKEN: ${SPORT_API_TOKEN}
      SERVER_PORT: ":8080"
      REDIS_ADDR: esmeralda-redis:6379
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@esmeralda-postgres:5432/${POSTGRES_USER}?sslmode=disable"
      GIN_MODE: "release"
      GAMES_LIMIT: "0"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  parser:
    image: ghcr.io/zollidan/esmeralda-parser:latest
    container_name: esmeralda-parser
    restart: unless-stopped
    environment:
      SPORT_API_TOKEN: ${SPORT_API_TOKEN}
      REDIS_ADDR: esmeralda-redis:6379
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@esmeralda-postgres:5432/${POSTGRES_USER}?sslmode=disable"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q --spider http://localhost:8081/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  bot:
    image: ghcr.io/zollidan/esmeralda-bot:latest
    container_name: esmeralda-bot
    restart: unless-stopped
    environment:
      SPORT_API_TOKEN: ${SPORT_API_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_DEBUG: false
      API_BASE_URL: "http://esmeralda-api:8080"

  frontend:
    image: ghcr.io/zollidan/esmeralda-frontend:latest
    container_name: esmeralda-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3030}:3000"
    environment:
      NUXT_API_BASE: "http://esmeralda-api:8080"

networks:
  default:
    name: esmeralda-network
    external: true
