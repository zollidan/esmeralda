services:
  postgres:
    image: postgres:16-alpine
    container_name: esmeralda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: esmeralda
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: esmeralda
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-esmeralda} -d ${POSTGRES_DB:-esmeralda}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: esmeralda-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
